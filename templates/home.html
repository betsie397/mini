
<html>
    <head>
        <title>Website</title>
        <link href="../static/styles.css" type="text/css" rel="stylesheet">
        <script src="../static/form.js"></script>
        <script src="../static/table.js"></script>
    </head>

    <body>
        <div class="title">
            <h1>Music Tracker !!!!!!!!!!</h1>
        </div>

        <div class="navbar">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('second') }}">Second Page</a>
        </div>

        <button type="button" onclick="showForm()">Click to add a new practice session</button> 
        <div id="form">
            <form action="{{ url_for('home')}}" method="POST">
                <br>
                <label for="date">Date:</label>
                <input type="date" id="date" name="date" max = "{{today}}" required>
                <br>
                <br>
                <label for="duration">Duration:</label>
                <input type="time" id="duration" name="duration" min="0" max="24" step="60" required>
                <br>
                <br>
                <label for="instrument">Instrument:</label>
                <select id="instrument" name="instrument" required>
                    <option value="" disabled selected>Select an instrument</option>
                    <option value="piano">Piano</option>
                    <option value="trumpet">Trumpet</option>
                </select>
                <br>
                <br>
                <label for="scales">Scales</label>
                <input type="checkbox" id="scales" name="scales">
                <br>
                <label for="exercises">Exercises/Studies</label>
                <input type="checkbox" id="exercises" name="exercises">
                <br>
                <label for="pieces">Pieces</label>
                <input type="checkbox" id="pieces" name="pieces">
                <br>
                <br>
                <label for="description">Description</label>
                <input type="longtext" id="description" name="description">
                <br>
                <br>
                <input type="submit" value="Submit">
                <input type="Reset" value="Reset">
            </form>
        </div>

        <div class="practice_log">
            <table id="table"></table>
            <script>showTable( {{ data | tojson }} );</script>
        </div>
    </body>
</html>
